<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebVault — запуск</title>
<style>
:root{color-scheme:dark;--bg:#151821;--panel:#202533;--text:#edf0f7;--accent:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 Arial,sans-serif}main{max-width:850px;margin:60px auto;padding:24px}section{background:var(--panel);padding:24px;border-radius:12px;margin:20px 0}button{background:var(--accent);color:#111827;border:0;border-radius:6px;padding:12px 16px;margin:4px;cursor:pointer}button:disabled{opacity:.6}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#b9c2d7}
</style>
</head>
<body>
<main>
<h1>WebVault</h1>
<p>Первый каркас сайта. Авторизация и редактор ещё не реализованы.</p>
<section>
<h2>Проверка запуска</h2>
<p>Диагностика работает только при открытии сайта на самом сервере. Проверка БД выполняет только чтение.</p>
<button type="button" data-url="api/health.ashx">Проверить ASP.NET</button>
<button type="button" data-url="api/health.ashx?check=db">Проверить SQL Server</button>
<pre id="result" role="status" aria-live="polite">Выберите проверку.</pre>
</section>
<small>Личные хранилища не следует размещать в публичной папке сайта.</small>
</main>
<script>
(function(){
  'use strict';
  var buttons=document.querySelectorAll('button[data-url]');
  var result=document.getElementById('result');
  function check(url){
    result.textContent='Проверка...';
    for(var i=0;i<buttons.length;i++){buttons[i].disabled=true;}
    var xhr=new XMLHttpRequest();
    xhr.open('GET',url,true);
    xhr.timeout=15000;
    function finish(message){result.textContent=message;for(var j=0;j<buttons.length;j++){buttons[j].disabled=false;}}
    xhr.onload=function(){
      var message='HTTP '+xhr.status;
      try{message+='\n'+JSON.stringify(JSON.parse(xhr.responseText),null,2);}catch(e){message+='\nОтвет не является JSON. Проверьте настройки IIS и ASP.NET.';}
      finish(message);
    };
    xhr.onerror=function(){finish('Ошибка соединения с сайтом.');};
    xhr.ontimeout=function(){finish('Превышено время ожидания.');};
    xhr.send();
  }
  for(var i=0;i<buttons.length;i++){buttons[i].addEventListener('click',function(){check(this.getAttribute('data-url'));});}
}());
</script>
</body>
</html>
