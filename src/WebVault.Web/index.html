<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="same-origin"><title>WebVault — диагностика</title><link rel="stylesheet" href="assets/css/app.css"></head><body><nav id="navigation" aria-label="Навигация"></nav><main><h1>WebVault</h1><p>Используйте навигацию для входа и перехода в свой раздел.</p><section><h2>Локальная диагностика</h2><button type="button" data-url="api/health.ashx">Проверить ASP.NET</button><button type="button" data-url="api/health.ashx?check=db">Проверить SQL Server</button><pre id="status" role="status" aria-live="polite">Выберите проверку.</pre></section></main><script src="assets/js/ui.js"></script><script>(function(){var ui=WebVaultUI;ui.nav(null);ui.me().catch(function(error){if(error.status!==401){ui.status(error.message);}});var buttons=document.querySelectorAll('button[data-url]');for(var i=0;i<buttons.length;i++){buttons[i].addEventListener('click',function(){var url=this.getAttribute('data-url');ui.run(function(){return ui.request(url,null).then(function(body){ui.status(JSON.stringify(body,null,2));});});}}}());</script></body></html>
