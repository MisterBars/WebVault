<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="same-origin"><title>WebVault — вход</title><link rel="stylesheet" href="assets/css/app.css"></head>
<body><nav id="navigation" aria-label="Навигация"></nav><main><h1>Вход в WebVault</h1><pre id="status" role="status" aria-live="polite"></pre>
<section><form id="loginForm"><label>Логин<input name="login" required minlength="3" maxlength="64" pattern="[A-Za-z0-9_.-]{3,64}" autocomplete="username"></label><label>Пароль<input name="password" type="password" required maxlength="128" autocomplete="current-password"></label><button type="submit">Войти</button></form></section>
<details id="setupPanel" hidden><summary>Создать первого администратора</summary><p>После создания выключите AdminSetupEnabled и очистите AdminSetupKey в локальном Web.config.</p><form id="setupForm"><label>Ключ настройки<input name="setupKey" type="password" required maxlength="256" autocomplete="off"></label><label>Логин<input name="login" required minlength="3" maxlength="64" pattern="[A-Za-z0-9_.-]{3,64}" autocomplete="username"></label><label>Имя<input name="displayName" required maxlength="100"></label><label>Пароль — от 15 символов<input name="password" type="password" required minlength="15" maxlength="128" autocomplete="new-password"></label><label>Повтор пароля<input name="confirmPassword" type="password" required minlength="15" maxlength="128" autocomplete="new-password"></label><button type="submit">Создать администратора</button></form></details>
</main><script src="assets/js/ui.js"></script><script>
(function(){'use strict';var ui=WebVaultUI;ui.nav(null);var setup=document.getElementById('setupPanel');
function setupStatus(){return ui.request('api/auth/setup_status.ashx',null).then(function(body){setup.hidden=!body.canSetup;});}
document.getElementById('loginForm').addEventListener('submit',function(event){event.preventDefault();var form=this;ui.run(function(){return ui.request('api/auth/login.ashx',{login:form.elements.login.value,password:form.elements.password.value}).then(function(){form.elements.password.value='';return ui.me();}).then(function(user){location.replace(ui.home(user));});});});
document.getElementById('setupForm').addEventListener('submit',function(event){event.preventDefault();var form=this;if(form.elements.password.value!==form.elements.confirmPassword.value){ui.status('Пароли не совпадают.');return;}ui.run(function(){return ui.request('api/auth/setup.ashx',{login:form.elements.login.value,displayName:form.elements.displayName.value,password:form.elements.password.value},{'X-Setup-Key':form.elements.setupKey.value}).then(function(){document.getElementById('loginForm').elements.login.value=form.elements.login.value;form.reset();setup.hidden=true;ui.status('Администратор создан. Выключите настройку и удалите ключ в Web.config, затем войдите.');});});});
ui.me().then(function(user){location.replace(ui.home(user));}).catch(function(error){if(error.status===401){ui.status('Введите логин и пароль.');setupStatus().catch(function(failure){ui.status('Не удалось проверить первоначальную настройку: '+failure.message);});}else{ui.status(error.message);}});
}());
</script></body></html>
