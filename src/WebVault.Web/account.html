<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="same-origin"><title>WebVault — учётная запись</title><link rel="stylesheet" href="assets/css/app.css"></head><body><nav id="navigation" aria-label="Навигация"></nav><main><h1>Учётная запись</h1><pre id="status" role="status" aria-live="polite"></pre><div id="account" hidden><section><h2 id="name"></h2><p id="login"></p></section><section><h2>Сменить свой пароль</h2><p>После смены будут завершены все ваши сессии, включая эту. Потребуется повторный вход. Пароль другой учётной записи здесь изменить нельзя.</p><form id="passwordForm"><label>Текущий пароль<input name="currentPassword" type="password" required maxlength="128" autocomplete="current-password"></label><label>Новый пароль — от 15 до 128 символов<input name="newPassword" type="password" required minlength="15" maxlength="128" autocomplete="new-password"></label><label>Повтор нового пароля<input name="confirmPassword" type="password" required minlength="15" maxlength="128" autocomplete="new-password"></label><button type="submit">Сменить пароль и завершить сессии</button></form></section><p>Темы, оформление и настройки заметок добавим после подключения хранилища.</p></div></main><script src="assets/js/ui.js"></script><script>
(function(){'use strict';var ui=WebVaultUI;
document.getElementById('passwordForm').addEventListener('submit',function(event){event.preventDefault();var form=this;var data={currentPassword:form.elements.currentPassword.value,newPassword:form.elements.newPassword.value,confirmPassword:form.elements.confirmPassword.value};if(data.newPassword!==data.confirmPassword){ui.status('Пароли не совпадают.');return;}if(data.newPassword===data.currentPassword){ui.status('Новый пароль должен отличаться от текущего.');return;}ui.run(function(){return ui.requireUser().then(function(){return ui.request('api/auth/change_password.ashx',data);}).then(function(){form.reset();document.getElementById('account').hidden=true;ui.nav(null);ui.status('Пароль изменён. Все сессии завершены. Нажмите «Войти» и используйте новый пароль.');}).catch(function(error){if(error.status===401){location.replace('auth.html');}throw error;});});});
ui.run(function(){return ui.requireUser().then(function(user){document.getElementById('name').textContent=user.displayName;document.getElementById('login').textContent='Логин: '+user.login+(user.isAdmin?' — администратор':'');document.getElementById('account').hidden=false;ui.status('Настройки вашей учётной записи.');});});
}());
</script></body></html>
