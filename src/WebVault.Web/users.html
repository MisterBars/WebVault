<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="same-origin"><title>WebVault — администрирование</title><link rel="stylesheet" href="assets/css/app.css"></head><body><nav id="navigation" aria-label="Навигация"></nav><main><h1>Администрирование</h1><pre id="status" role="status" aria-live="polite"></pre><div id="admin" hidden>
<section><h2>Пользователи</h2><button type="button" id="refresh">Обновить список</button><div style="overflow-x:auto"><table><thead><tr><th>Логин</th><th>Имя</th><th>Роль</th><th>Статус</th><th>Действия</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section><h2>Создать обычного пользователя</h2><form id="create"><label>Логин<input name="login" required minlength="3" maxlength="64" pattern="[A-Za-z0-9_.-]{3,64}" autocomplete="off"></label><label>Имя<input name="displayName" required maxlength="100"></label><label>Пароль — от 15 символов<input name="password" type="password" required minlength="15" maxlength="128" autocomplete="new-password"></label><label>Повтор пароля<input name="confirmPassword" type="password" required minlength="15" maxlength="128" autocomplete="new-password"></label><button type="submit">Создать пользователя</button></form></section>
<p>Удаление мягкое: вход запрещается, сессии отзываются, данные сохраняются. Логин остаётся занятым. Администраторы не удаляются этим действием.</p></div></main><script src="assets/js/ui.js"></script><script>
(function(){'use strict';var ui=WebVaultUI;
function list(){return ui.request('api/admin/users.ashx',null).then(function(body){var rows=document.getElementById('rows');rows.textContent='';body.users.forEach(function(user){var row=document.createElement('tr');[user.login,user.displayName,user.isAdmin?'Администратор':'Пользователь',user.isActive?'Активен':'Отключён'].forEach(function(value){var cell=document.createElement('td');cell.textContent=value;row.appendChild(cell);});var actions=document.createElement('td');if(!user.isAdmin){var button=document.createElement('button');button.type='button';button.className='danger';button.textContent='Удалить';button.addEventListener('click',function(){if(!window.confirm('Удалить пользователя '+user.login+'? Вход будет запрещён, сессии отозваны. Данные останутся, логин не освободится.')){return;}ui.run(function(){return ui.requireUser(true).then(function(){return ui.request('api/admin/user_delete.ashx',{userId:user.id});}).then(list).then(function(){ui.status('Пользователь удалён из активного списка.');});});});actions.appendChild(button);}else{actions.textContent='—';}row.appendChild(actions);rows.appendChild(row);});});}
document.getElementById('refresh').addEventListener('click',function(){ui.run(function(){return ui.requireUser(true).then(list).then(function(){ui.status('Список обновлён.');});});});
document.getElementById('create').addEventListener('submit',function(event){event.preventDefault();var form=this;if(form.elements.password.value!==form.elements.confirmPassword.value){ui.status('Пароли не совпадают.');return;}ui.run(function(){return ui.requireUser(true).then(function(){return ui.request('api/admin/users.ashx',{login:form.elements.login.value,displayName:form.elements.displayName.value,password:form.elements.password.value});}).then(function(){form.reset();return list();}).then(function(){ui.status('Пользователь создан.');});});});
ui.run(function(){return ui.requireUser(true).then(function(){document.getElementById('admin').hidden=false;return list();}).then(function(){ui.status('Управление пользователями.');});});
}());
</script></body></html>
