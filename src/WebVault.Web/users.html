<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="same-origin"><title>WebVault — пользователи</title>
<style>body{background:#151821;color:#edf0f7;font:16px/1.6 Arial,sans-serif;margin:0}main{max-width:900px;margin:30px auto;padding:20px}section{background:#202533;padding:20px;border-radius:10px;margin:20px 0}label{display:block;margin:10px 0}input{box-sizing:border-box;display:block;width:100%;padding:9px;font:inherit}button{padding:10px;margin-top:10px}a{color:#91b7ff}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid #596176}pre{white-space:pre-wrap;overflow-wrap:anywhere}[hidden]{display:none!important}</style></head>
<body><main><h1>Пользователи WebVault</h1><p><a href="auth.html">Вход и сессия</a></p><pre id="status" role="status" aria-live="polite"></pre>
<div id="admin" hidden><section><h2>Учётные записи</h2><button id="refresh" type="button">Обновить список</button><table><thead><tr><th>Логин</th><th>Имя</th><th>Администратор</th><th>Активен</th></tr></thead><tbody id="rows"></tbody></table></section>
<section><h2>Создать обычного пользователя</h2><form id="create"><label>Логин<input name="login" required minlength="3" maxlength="64" pattern="[A-Za-z0-9_.-]{3,64}" autocomplete="off"></label><label>Имя<input name="displayName" required maxlength="100"></label><label>Пароль — от 15 символов<input name="password" type="password" required minlength="15" maxlength="128" autocomplete="new-password"></label><label>Повтор пароля<input name="confirmPassword" type="password" required minlength="15" maxlength="128" autocomplete="new-password"></label><button type="submit">Создать пользователя</button></form><p>Личные папки заметок подключим следующим этапом. Эта форма создаёт только учётную запись, без прав администратора.</p></section></div></main>
<script>
(function(){'use strict';var csrf=null,busy=false;var status=document.getElementById('status');
function request(url,data){var options={method:data===null?'GET':'POST',credentials:'same-origin',cache:'no-store',headers:{'X-WebVault-Request':'1'}};if(data!==null){options.headers['Content-Type']='application/json';options.headers['X-CSRF-Token']=csrf;options.body=JSON.stringify(data);}return fetch(url,options).then(function(response){return response.text().then(function(text){var body;try{body=JSON.parse(text);}catch(e){throw new Error('HTTP '+response.status+': ответ не JSON. Проверьте ошибку IIS.');}if(!response.ok){var error=new Error(body.error+(body.errorId?' / '+body.errorId:''));error.status=response.status;throw error;}return body;});});}
function session(){return request('api/auth/me.ashx',null).then(function(body){if(!body.user.isAdmin){throw new Error('Доступ только администратору.');}csrf=body.csrfToken;document.getElementById('admin').hidden=false;});}
function list(){return request('api/admin/users.ashx',null).then(function(body){var rows=document.getElementById('rows');rows.textContent='';body.users.forEach(function(user){var row=document.createElement('tr');[user.login,user.displayName,user.isAdmin?'да':'нет',user.isActive?'да':'нет'].forEach(function(value){var cell=document.createElement('td');cell.textContent=value;row.appendChild(cell);});rows.appendChild(row);});});}
function run(work){if(busy){return;}busy=true;var buttons=document.querySelectorAll('button');for(var i=0;i<buttons.length;i++){buttons[i].disabled=true;}status.textContent='Выполняется...';work().catch(function(error){if(error.status===401||error.status===403){document.getElementById('admin').hidden=true;csrf=null;}status.textContent=error.message;}).then(function(){busy=false;for(var i=0;i<buttons.length;i++){buttons[i].disabled=false;}});}
document.getElementById('refresh').addEventListener('click',function(){run(function(){return session().then(list).then(function(){status.textContent='Список обновлён.';});});});
document.getElementById('create').addEventListener('submit',function(event){event.preventDefault();var form=this;if(form.elements.password.value!==form.elements.confirmPassword.value){status.textContent='Пароли не совпадают.';return;}run(function(){return session().then(function(){return request('api/admin/users.ashx',{login:form.elements.login.value,displayName:form.elements.displayName.value,password:form.elements.password.value});}).then(function(){form.reset();return list();}).then(function(){status.textContent='Пользователь создан.';});});});
run(function(){return session().then(list).then(function(){status.textContent='Управление пользователями доступно.';});});
}());
</script></body></html>
