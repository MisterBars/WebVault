<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="same-origin"><title>WebVault — личный раздел</title><link rel="stylesheet" href="assets/css/app.css"></head><body><nav id="navigation" aria-label="Навигация"></nav><main><h1>Личный раздел</h1><pre id="status" role="status" aria-live="polite"></pre><section id="personal" hidden><h2 id="welcome"></h2><p>Здесь будут ваши заметки и личные настройки.</p><p>Файловое хранилище, редактор и настройки пока не реализованы. Это каркас личного раздела, а не работающий блокнот.</p></section></main><script src="assets/js/ui.js"></script><script>WebVaultUI.run(function(){return WebVaultUI.requireUser(false).then(function(user){document.getElementById('personal').hidden=false;document.getElementById('welcome').textContent=user.displayName;WebVaultUI.status('Вход выполнен под личной учётной записью.');});});</script></body></html>
